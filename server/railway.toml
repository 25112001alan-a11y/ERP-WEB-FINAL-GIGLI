# Railway deploy config for the API. Select this directory as the root
# directory when connecting the repo (deploy root = server/).
[build]
builder = "nixpacks"
# --include=dev: NODE_ENV=production would otherwise skip typescript and break `npm run build`.
buildCommand = "npm ci --include=dev && npx prisma generate && npm run build"

[deploy]
startCommand = "node dist/index.js"
healthcheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10